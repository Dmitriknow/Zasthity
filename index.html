<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация объекта</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0; padding: 24px;
    color: #222;
  }
  .card {
    max-width: 720px; margin: 0 auto;
    background: #fff; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    padding: 32px;
  }
  h1 { margin: 0 0 8px; font-size: 22px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
  input, textarea {
    width: 100%; padding: 11px 12px;
    border: 1px solid #d0d5dd; border-radius: 8px;
    font-size: 14px; font-family: inherit;
    transition: border-color .15s;
  }
  input:focus, textarea:focus { outline: none; border-color: #2f6feb; }
  textarea { resize: vertical; min-height: 80px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  button {
    margin-top: 24px; width: 100%; padding: 13px;
    background: #2f6feb; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  button:hover:not(:disabled) { background: #1e57c9; }
  button:active:not(:disabled) { transform: scale(.99); }
  button:disabled { background: #98b2e8; cursor: not-allowed; }

  /* Инлайн-сообщение */
  .status {
    margin-top: 16px; padding: 14px 16px;
    border-radius: 8px; font-size: 14px;
    display: none;
    animation: fadeSlide .3s ease-out;
  }
  .ok  { background: #e7f6ec; color: #17663a; border-left: 4px solid #22a35a; display: block; }
  .err { background: #fdecec; color: #9b1c1c; border-left: 4px solid #d23c3c; display: block; }
  .ok strong, .err strong { display: block; margin-bottom: 4px; font-size: 15px; }
  .ok small { color: #3d7a58; }

  /* Всплывающий тост */
  .toast {
    position: fixed; top: 24px; right: 24px;
    background: #17663a; color: #fff;
    padding: 14px 20px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(23,102,58,.35);
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transform: translateY(-16px);
    transition: opacity .3s, transform .3s;
    pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast .icon {
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="card">
  <h1>Регистрация объекта</h1>
  <p class="sub">Дата регистрации проставляется автоматически при отправке.</p>

  <form id="regForm"
        action="https://script.google.com/macros/s/AKfycbyJSDRFvoS-4L9nXjMffCIc0xuUS9Gr6E7Nt5A2bnAu3_cfhbRiyrz0MGjQRNn_iYX0/exec"
        method="POST">

    <label>Название объекта *</label>
    <input name="name" required placeholder="Например: Склад №3, ЖК «Северный»">

    <label>Адрес *</label>
    <input name="address" required placeholder="Город, улица, дом">

    <div class="row">
      <div>
        <label>Координаты</label>
        <input name="coords" placeholder="55.7558, 37.6173">
      </div>
      <div>
        <label>Застройщик / Подрядчик</label>
        <input name="developer" placeholder="ООО «Ромашка»">
      </div>
    </div>

    <label>Ассортимент</label>
    <textarea name="assortment" placeholder="Перечень материалов / позиций"></textarea>

    <label>Сроки поставки</label>
    <input name="delivery" placeholder="например: 01.06.2026 – 15.06.2026">

    <button type="submit" id="submitBtn">Отправить</button>
    <div id="status" class="status"></div>
  </form>
</div>

<!-- Всплывающее уведомление -->
<div id="toast" class="toast">
  <span class="icon">✓</span>
  <span>Объект успешно зарегистрирован</span>
</div>

<script>
  const form   = document.getElementById('regForm');
  const btn    = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  const toast  = document.getElementById('toast');

  function showToast(text) {
    toast.querySelector('span:last-child').textContent = text;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 3500);
  }

  function showInline(type, title, detail) {
    status.className = 'status ' + (type === 'ok' ? 'ok' : 'err');
    status.innerHTML = `<strong>${title}</strong>${detail ? `<small>${detail}</small>` : ''}`;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    btn.disabled = true;
    btn.textContent = 'Отправка…';
    status.className = 'status';
    status.textContent = '';

    const data = new FormData(form);
    const objName = (data.get('name') || '').trim();

    try {
      // Apps Script Web App принимает POST, но не отдаёт CORS-заголовки,
      // поэтому используем mode:'no-cors' (ответ opaque, но статус не падает).
      await fetch(form.action, {
        method: 'POST',
        mode: 'no-cors',
        body: data
      });

      // Если fetch не упал — считаем, что запрос ушёл
      const now = new Date().toLocaleString('ru-RU');
      showInline(
        'ok',
        '✅ Объект успешно зарегистрирован!',
        `«${objName}» — отправлено ${now}. Строка добавлена в Google Таблицу.`
      );
      showToast('Объект «' + objName + '» добавлен в таблицу');
      form.reset();

    } catch (err) {
      showInline(
        'err',
        '❌ Не удалось отправить данные',
        'Проверьте интернет-соединение или обратитесь к администратору. (' + err.message + ')'
      );
      showToast('Ошибка отправки');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Отправить';
    }
  });
</script>

</body>
</html>
